<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            padding: 40px;
            align-items: center;
        }

        .email-input {
            width: 350px;
            padding: 14px 16px;
            font-size: 16px;
            color: #333;
            border: 1px solid #767676;
            border-radius: 8px; 
            outline: none;
            transition: border-color 0.2s;
        }

        .email-input:focus {
            border-color: #000; 
        }


        .continue-btn {
            background-color: #111; 
            color: #fff;         
            font-size: 16px;
            font-weight: bold;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;   
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .continue-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    
    <div>
        <h3>
           <b> Enter your email to join us or sign in.</b>
        </h3>
    </div>

    <div>
        <input type="email" class="email-input" placeholder="Email*">
    </div>

    <div>
        <input type="password" class="email-input" placeholder="Password*">
    </div>

    <div>
        <button class="continue-btn">Continue</button>
    </div>

</body>
</html>
