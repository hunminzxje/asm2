<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #111111;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* --- HEADER --- */
        header {
            border-bottom: 1px solid #ddd;
            padding: 15px 40px;
            background: #ffffff;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #555;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- CART MAIN CONTAINER --- */
        .cart-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .cart-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .cart-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* --- CART ITEMS LIST --- */
        .cart-items {
            flex: 2;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 4px;
            color: #777;
            font-style: italic;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- SUMMARY BOX --- */
        .cart-summary {
            flex: 1;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
        }

        .summary-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #ddd;
            padding-top: 12px;
            margin-top: 12px;
        }

        .promo-input-group {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }

        .promo-input-group input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .promo-btn {
            background: #e0e0e0;
            border: 1px solid #ccc;
            padding: 0 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .promo-btn:hover {
            background: #d0d0d0;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            background: #111111;
            color: #ffffff;
            text-align: center;
            padding: 12px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
        }

        .checkout-btn:hover {
            background: #333333;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-text">NIKE</a>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="c:\hunm1nzzzzz\hoc\imudl\asm\asm1.html">Products</a></li>
                <li><a href="c:\hunm1nzzzzz\hoc\imudl\asm\cart.html">Cart</a></li>
                <li><a href="c:\hunm1nzzzzz\hoc\imudl\asm\login.html">Login</a></li>
            </ul>
            <div class="nav-actions">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-bag-shopping"></i>
            </div>
        </div>
    </header>

    <!-- CART SECTION -->
    <section class="cart-section">
        <h1 class="cart-title">Giỏ Hàng Của Bạn</h1>
        
        <div class="cart-layout">
            <div class="cart-items">
                <p>Chưa có sản phẩm nào trong giỏ hàng.</p>
            </div>

            <!-- Đơn hàng -->
            <div class="cart-summary">
                <div class="summary-title">Tóm Tắt Đơn Hàng</div>
                
                <div class="summary-row">
                    <span>Tạm tính</span>
                    <span>0₫</span>
                </div>
                <div class="summary-row">
                    <span>Vận chuyển</span>
                    <span>Miễn phí</span>
                </div>

                <div class="promo-input-group">
                    <input type="text" placeholder="Mã giảm giá">
                    <button class="promo-btn">Áp dụng</button>
                </div>

                <div class="summary-row total">
                    <span>Tổng cộng</span>
                    <span>0₫</span>
                </div>

                <a href="#" class="checkout-btn">Tiến Hành Thanh Toán</a>
            </div>
        </div>
    </section>

</body>
</html>
